services:
  portal:
    image: ${PORTAL_IMAGE:-ghcr.io/mulich/dartfreunde-platten-portal:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-18080}:8000"
    volumes:
      - portal-data:/data
    shm_size: 1gb

volumes:
  portal-data:
    name: dartfreunde-platten-portal-data
